name: Workspace CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Project quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check workspace TypeScript
        run: pnpm exec nx run-many -t typecheck

      - name: Check browser TypeScript
        run: pnpm --filter @shop/shop-app typecheck:browser
